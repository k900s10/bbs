name: Build & Deploy BBS

on:
  push:
    branches: [ main ]
  # optional: you can also trigger on tags
  # tags:
  #   - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production   # <-- the environment that holds your public secrets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun (or Node)
        # Bun is used locally; switch to Node if you prefer.
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      # ---------- Generate public env.js from GitHub secrets ----------
      - name: Create js/config/env.js
        run: |
          mkdir -p js/config
          cat <<'EOF' > js/config/env.js
          window.ENV = {
            SUPABASE_URL: "${{ secrets.SUPABASE_URL }}",
            SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}",
            // Add more public variables here if needed, e.g.:
            // APP_TITLE: "${{ secrets.APP_TITLE }}",
          };
          EOF

      # ---------- No build step: this is a pure-HTML static site ----------

      # ---------- Deploy to GitHub Pages ----------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .        # Publish the repo root (pure-HTML, no build step)
